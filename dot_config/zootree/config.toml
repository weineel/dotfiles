agent_cli = 'cc_brainstorming'

[multiplexer]
#kind = "cmux"
kind = "herdr"

[multiplexer.herdr]
session = "default"

[multiplexer.zellij]
layout = "default"

[multiplexer.cmux]
layout = "default"

[agent_cli_alias]
cc = "claude --dangerously-skip-permissions -- $prompt"
cc_brainstorming = 'claude --dangerously-skip-permissions -- "/superpowers:brainstorming $prompt"'
codex = "codex --ask-for-approval never -- $prompt"
codexd = "codex --dangerously-bypass-approvals-and-sandbox -- $prompt"
codex_brainstorming = 'codex --ask-for-approval never -- "$superpowers:brainstorming $prompt"'
codexd_brainstorming = 'codex --dangerously-bypass-approvals-and-sandbox -- "$superpowers:brainstorming $prompt"'
codexd_grill_me = 'codex --dangerously-bypass-approvals-and-sandbox -- "$mattpocock-skills:grill-with-docs $prompt"'
codexd_grill_agent = 'codex --dangerously-bypass-approvals-and-sandbox -- "$mattpocock-skills:grill-agent-with-docs $prompt"'

