[tools]
"cargo:zootree" = "latest"
gh = "latest"
go = "latest"
herdr = "latest"
lazygit = "latest"
node = "24"
"npm:@antfu/ni" = "latest"
"npm:commitizen" = "latest"
"npm:yarn" = "1"
pnpm = "latest"

[env]
PNPM_HOME = "{{env.HOME}}/.local/share/pnpm"
_.path = [
  "{{env.HOME}}/.local/share/pnpm",
  "{{env.HOME}}/.local/share/pnpm/bin",
]

[settings]
trusted_config_paths = [
  "~/zootree-workspaces"
]
experimental = true
minimum_release_age_excludes = [
  "cargo:zootree"
]

[bootstrap.packages]
"brew:mole" = "latest"
